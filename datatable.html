        table.dataTable td span {
            float: right;
        }

        .dt-info {
            padding: 1em;
            font-size: 10pt;
            color: gray;

            margin: 0.5em 0 0 0;

        }

        custom.select {
            color: black;
            max-width: 15.5em;
            margin: 1px;
        }

        .dtlogo {
            opacity: 0.5;
            width: auto;
            display: block;
            z-index: 2;
            position: absolute;
            top: 0px;
            right: 0px;
            margin: 1em;
        }

        .dt-info {
            padding: 0;
            font-size: 9pt;
            color: gray;
        }

        span.dt-column-title {
            white-space: wrap;
            font-weight: 600;
            font-size: 0.87rem;
            line-height: 1.1;
        }


        /* Default state */
        .dt-input {
            /*  border: 2px solid #ccc;
            padding: 6px 10px; */
            border-radius: 6px;
            transition: all 0.2s ease-in-out;

        }

        /* Highlight only when user typed something */
        input.dt-input:not(:placeholder-shown) {
            background-color: #e0f0ff !important;
            /* light blue */
            border-color: #66b2ff !important;
            font-weight: bold;
        }

        input[type="search"]::-webkit-search-cancel-button {
            -webkit-appearance: auto;
            appearance: auto;
            cursor: pointer;
        }


        div.dtcc-title {
            font-weight: 600;
        }

        table.dataTable span.dtcc span.dtcc-button-icon {
            color: #0A2540;
            /* #0A2540  #00457C #0D47A1  #0A3D62 #052C65 */
            --dt-row-selected-stripe-alpha: 0.99
        }



        .custom_btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 3px 4px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #f7f7f7;
            border-radius: 3px;
            /* margin:0 1em 0 0; */
        }

        .custom_btn .icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom_btn:hover {
            background: #e9e9e9;
        }

        button.dt-button {
            padding: .2rem 0.5rem !important;
        }

        div.dt-buttons {
            margin-right: 1rem;

        }
